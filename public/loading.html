<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AiroShare</title>
  <style>
    body {
      background-color: #070405;
      color: #fcfcfc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 93, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(224, 42, 36, 0.05) 0px, transparent 50%);
    }

    .container {
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 28px auto;
    }

    .logo {
      width: 80px;
      height: 80px;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
    }

    .spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100px;
      height: 100px;
      border: 3px solid rgba(255, 93, 11, 0.08);
      border-top: 3px solid #FF5D0B;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      box-shadow: 0 0 15px rgba(255, 93, 11, 0.15);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fcfcfc 30%, #FFB38A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #bdaeb1;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .status-msg {
      margin-top: 24px;
      font-size: 0.76rem;
      color: #736567;
      font-family: monospace;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="spinner"></div>
      <img class="logo" src="AiroShare.png" alt="AiroShare Logo" />
    </div>
    <div class="title">AiroShare</div>
    <div class="subtitle">INITIALIZING MEDIA ENGINE</div>
    <div class="status-msg">Starting backend services...</div>
  </div>
</body>
</html>
