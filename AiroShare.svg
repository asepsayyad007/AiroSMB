<svg xmlns="http://w3.org" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Pure Sunset Gradient (Warm Oranges & Deep Reds Only) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5D0B"/>
      <stop offset="30%" stop-color="#FF4C25"/>
      <stop offset="65%" stop-color="#E02A24"/>
      <stop offset="90%" stop-color="#9E121F"/>
      <stop offset="100%" stop-color="#7C0813"/>
    </linearGradient>

    <!-- PC Monitor Screen Interior Fill Gradient -->
    <linearGradient id="monitorScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B2B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B050A" stop-opacity="0.65"/>
    </linearGradient>

    <!-- App Branding Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFB38A"/>
    </linearGradient>

    <!-- Drop shadow for floating elements -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Main Icon Base (Premium Squircle Frame) -->
  <rect x="50" y="50" width="900" height="900" rx="240" fill="url(#bgGrad)" />

  <!-- 2. Main White Iconography Group (PC Monitor Integrated with Share Nodes) -->
  <g filter="url(#elementShadow)">
    
    <!-- CENTRAL PC MONITOR DISPLAY -->
    <!-- PC Stand Neck -->
    <path d="M 480,540 L 480,610 L 520,610 L 520,540 Z" fill="#FFFFFF"/>
    <!-- PC Stand Base -->
    <path d="M 410,610 L 590,610" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <!-- PC Monitor Bezel Shell -->
    <rect x="250" y="270" width="500" height="280" rx="20" fill="url(#monitorScreenGrad)" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" />

    <!-- INTEGRATED SHARE ARROW NETWORK -->
    <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Connecting Track Lines -->
      <line x1="440" y1="410" x2="550" y2="350" />
      <line x1="440" y1="410" x2="550" y2="470" />
      
      <!-- Source Origin Node -->
      <circle cx="430" cy="410" r="18" fill="#FFFFFF" />
      
      <!-- Top Target Receiving Node -->
      <circle cx="560" cy="345" r="18" fill="#FFFFFF" />
      
      <!-- Bottom Target Receiving Node -->
      <circle cx="560" cy="475" r="18" fill="#FFFFFF" />
    </g>

  </g>

  <!-- 3. Typography Block: "AiroShare" Positioned Directly Below Monitor Stand -->
  <text x="500" y="735" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="82" text-anchor="middle" letter-spacing="1">
    <tspan fill="#FFFFFF">Airo</tspan><tspan fill="url(#textGrad)">Share</tspan>
  </text>
</svg>
