<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Pure Sunset Gradient (Warm Oranges & Deep Reds Only) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5D0B"/>
      <stop offset="30%" stop-color="#FF4C25"/>
      <stop offset="65%" stop-color="#E02A24"/>
      <stop offset="90%" stop-color="#9E121F"/>
      <stop offset="100%" stop-color="#7C0813"/>
    </linearGradient>

    <!-- PC Monitor Screen Interior Fill Gradient -->
    <linearGradient id="monitorScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B2B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B050A" stop-opacity="0.65"/>
    </linearGradient>

    <!-- App Branding Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFB38A"/>
    </linearGradient>

    <!-- Deepened drop shadow to support the new heavier visual elements -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Main Icon Base (Premium Squircle Frame) -->
  <rect x="50" y="50" width="900" height="900" rx="240" fill="url(#bgGrad)" />

  <!-- 2. Main White Iconography Group (All elements thickened for maximum visibility) -->
  <g filter="url(#elementShadow)">
    
    <!-- CENTRAL PC MONITOR DISPLAY (Thickened Borders and Base) -->
    <!-- Thickened PC Stand Neck -->
    <path d="M 470,540 L 470,610 L 530,610 L 530,540 Z" fill="#FFFFFF"/>
    <!-- Thickened PC Stand Base (Stroke increased from 20 to 32) -->
    <path d="M 390,610 L 610,610" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    <!-- Thickened PC Monitor Bezel Shell (Stroke increased from 26 to 40) -->
    <rect x="250" y="270" width="500" height="280" rx="24" fill="url(#monitorScreenGrad)" stroke="#FFFFFF" stroke-width="40" stroke-linejoin="round" />

    <!-- INTEGRATED SHARE ARROW NETWORK (Thickened Nodes and Tracks) -->
    <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Connecting Track Lines (Stroke increased from 16 to 26) -->
      <line x1="440" y1="410" x2="550" y2="350" stroke-width="26" />
      <line x1="440" y1="410" x2="550" y2="470" stroke-width="26" />
      
      {/* Source Origin Node (Radius increased from 18 to 26) */}
      <circle cx="430" cy="410" r="26" fill="#FFFFFF" stroke-width="0" />
      
      {/* Top Target Receiving Node (Radius increased from 18 to 26) */}
      <circle cx="560" cy="345" r="26" fill="#FFFFFF" stroke-width="0" />
      
      {/* Bottom Target Receiving Node (Radius increased from 18 to 26) */}
      <circle cx="560" cy="475" r="26" fill="#FFFFFF" stroke-width="0" />
    </g>

  </g>

  <!-- 3. Typography Block: "AiroShare" (Font weight maxed out, size increased to 86) -->
  <text x="500" y="745" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="86" text-anchor="middle" letter-spacing="1">
    <tspan fill="#FFFFFF">Airo</tspan><tspan fill="url(#textGrad)">Share</tspan>
  </text>
</svg>
